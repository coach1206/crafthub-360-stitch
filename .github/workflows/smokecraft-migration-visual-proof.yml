name: SmokeCraft Migration Visual Proof

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/smokecraft-codex-final
    paths:
      - 'src/pages/smokecraft/**'
      - 'src/components/smokecraft/**'
      - 'src/constants/smokecraftLiveScreenTokens.js'
      - 'scripts/smokecraftMigrationVisualProof.js'
      - '.github/workflows/smokecraft-migration-visual-proof.yml'

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Locate Chromium for proof harness
        shell: bash
        run: |
          CHROME_PATH=$(node -e "import('playwright').then(({chromium})=>console.log(chromium.executablePath()))")
          CHROME_DIR=$(dirname "$(dirname "$CHROME_PATH")")
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "Resolved Chromium: $CHROME_PATH"

      - name: Build and capture all 14 migrated screens
        run: node scripts/smokecraftMigrationVisualProof.js

      - name: Upload owner visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smokecraft-one-system-owner-visual-proof
          path: docs/visual-proof/migration/
          if-no-files-found: error
          retention-days: 30

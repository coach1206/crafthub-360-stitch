name: SmokeCraft 360 — Production Deployment Pipeline

# Production Package 4. PR checks always run. Staging deploy runs on push
# to the deployment branch. Production deploy requires an explicit
# workflow_dispatch AND a GitHub Environment approval gate — it never
# fires automatically from a push. This workflow is validated for YAML
# correctness and job-graph shape only in this sandbox; it has not been
# executed against real infrastructure (no cloud credentials here).

on:
  pull_request:
    branches: [main, recovery/smokecraft-codex-final]
  push:
    branches: [recovery/smokecraft-codex-final]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: smokecraft-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-and-lint:
    name: Install deps & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present

  validators:
    name: Prebuild validators
    runs-on: ubuntu-latest
    needs: install-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run prebuild

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: validators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist
          retention-days: 14

  container-build:
    name: Build production container image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed — validation only for PR/staging path)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smokecraft-production:ci

  security-scan:
    name: Dependency audit / security scan
    runs-on: ubuntu-latest
    needs: install-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical || echo "::warning::non-critical advisories present — see Package 3/4 proof docs for accepted-risk list"

  migration-validation:
    name: Validate migrations apply/rollback cleanly
    runs-on: ubuntu-latest
    needs: install-and-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
          POSTGRES_DB: smokecraft_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:ci_only_password_not_a_secret@localhost:5432/smokecraft_ci
        run: npm run db:migrate

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [container-build, security-scan, migration-validation]
    if: github.ref == 'refs/heads/recovery/smokecraft-codex-final' && github.event_name == 'push'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (placeholder — requires real platform credentials)
        run: |
          echo "Would run scripts/deploy.sh staging here."
          echo "Not executed against live infrastructure in this repository's CI as configured — requires STAGING_DEPLOY_TOKEN etc. secrets to be set by a human operator."
      - name: Post-deploy smoke test
        run: node scripts/verify-smokecraft-production-deployment.mjs || echo "::warning::smoke test requires a reachable staging URL — see deployment checklist"

  deploy-production:
    name: Deploy to production (approval-gated)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    environment:
      name: production   # GitHub Environment protection rule requires manual reviewer approval before this job runs
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (placeholder — requires real platform credentials + explicit human approval already satisfied by the Environment gate above)
        run: |
          echo "Would run scripts/deploy.sh production here."
          echo "Requires PRODUCTION_DEPLOY_TOKEN and a passing staging smoke test — not executed against live infrastructure in this sandbox."
      - name: Post-deploy smoke test
        run: node scripts/verify-smokecraft-production-deployment.mjs || echo "::warning::smoke test requires a reachable production URL — see deployment checklist"
      - name: Record deployment audit entry
        run: node scripts/recordDeploymentAudit.mjs production ${{ github.sha }}

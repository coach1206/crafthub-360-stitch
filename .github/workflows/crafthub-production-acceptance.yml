name: CraftHub Production Acceptance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crafthub-production-acceptance.yml'
  push:
    branches:
      - 'codex/crafthub-production-acceptance-gate'

permissions:
  contents: read
  deployments: read

jobs:
  structural-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Structural acceptance
        run: npm run acceptance:crafthub:structural
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  deployed-acceptance:
    if: github.event_name == 'push'
    needs: structural-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve successful Vercel preview for exact commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms))
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          }
          async function getJson(url) {
            const response = await fetch(url, { headers })
            if (!response.ok) throw new Error(`${response.status} ${url}`)
            return response.json()
          }
          ;(async () => {
            const base = `https://api.github.com/repos/${process.env.REPOSITORY}`
            for (let attempt = 1; attempt <= 30; attempt++) {
              const deployments = await getJson(`${base}/deployments?sha=${process.env.COMMIT_SHA}&environment=Preview&per_page=20`)
              for (const deployment of deployments) {
                const statuses = await getJson(deployment.statuses_url)
                const success = statuses.find(status => status.state === 'success' && status.environment_url)
                if (success) {
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${success.environment_url}\n`)
                  console.log(`Resolved exact deployment: ${success.environment_url}`)
                  return
                }
                const failed = statuses.find(status => ['failure', 'error', 'inactive'].includes(status.state))
                if (failed) throw new Error(`Vercel deployment failed for ${process.env.COMMIT_SHA}: ${failed.description || failed.state}`)
              }
              console.log(`Waiting for Vercel deployment of ${process.env.COMMIT_SHA} (${attempt}/30)`)
              await sleep(5000)
            }
            throw new Error(`No successful Vercel Preview deployment found for exact commit ${process.env.COMMIT_SHA}`)
          })().catch(error => { console.error(error); process.exit(1) })
          NODE
      - name: Production HTTP acceptance against exact deployed SHA
        env:
          CRAFTHUB_ACCEPTANCE_BASE_URL: ${{ steps.deployment.outputs.url }}
        run: npm run acceptance:crafthub:production
      - name: Install Chromium for deployed browser proof
        run: npx playwright install --with-deps chromium
      - name: Chronological route and owner-image browser proof
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/proveSmokecraftDeployedRouteMatrix.mjs
      - name: Full real-click chronological journey to Session 27
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/proveSmokecraftDeployedFullJourney.mjs
